[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sw-qsor"
version = "0.0.1"
description = "Quantitative structure-odour relationships, evaluated honestly."
readme = "readme.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "rdkit",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
test = ["pytest"]
# milestone 4: CPU PyTorch (install from https://download.pytorch.org/whl/cpu) and the
# iterative stratified split used by OpenPOM for check C1
pom = ["torch", "scikit-multilearn"]

[tool.setuptools.packages.find]
include = ["sw_qsor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
